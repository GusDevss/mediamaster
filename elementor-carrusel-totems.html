<!-- ============================================================
     MEDIAMASTER · Carrusel 3D de medios
     Pegar completo en un widget "HTML" de Elementor.
     Edita la lista MEDIOS (en el <script>) para cambiar
     imágenes, títulos y páginas de destino.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

<section class="mm-carousel" aria-roledescription="carrusel" aria-label="Nuestros medios publicitarios">
  <div class="mm-stage">
    <div class="mm-glow" aria-hidden="true"></div>
    <div class="mm-streaks" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="mm-ring"></div>
    <div class="mm-floor" aria-hidden="true"></div>
    <button class="mm-arrow mm-arrow--prev" type="button" aria-label="Anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="mm-arrow mm-arrow--next" type="button" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <nav class="mm-tabs" aria-label="Elegir medio"></nav>
  <p class="mm-live" aria-live="polite"></p>
</section>

<style>
.mm-carousel{
  --mm-pink:#ff0a6c; --mm-green:#22d65a; --mm-purple:#8a3ffc;
  --mm-yellow:#f5e400; --mm-orange:#ff7a00;
  --mm-brand:linear-gradient(90deg,var(--mm-green),var(--mm-purple),var(--mm-yellow),var(--mm-pink),var(--mm-orange));
  position:relative; overflow:hidden; isolation:isolate;
  background:#000; color:#fff;
  font-family:'Titillium Web',system-ui,sans-serif;
  padding:24px 0 36px; box-sizing:border-box;
}
.mm-carousel *,.mm-carousel *::before,.mm-carousel *::after{box-sizing:border-box}

/* ---------- escena ---------- */
.mm-carousel .mm-stage{
  position:relative; height:var(--sh,560px); max-width:1400px; margin:0 auto;
  touch-action:pan-y; user-select:none; -webkit-user-select:none;
}
.mm-carousel .mm-ring{position:absolute; inset:0; perspective:1600px; z-index:2}

.mm-carousel .mm-glow{
  position:absolute; left:50%; top:44%; width:70%; height:70%; z-index:0;
  transform:translate(-50%,-50%); pointer-events:none; filter:blur(60px); opacity:.35;
  background:radial-gradient(closest-side,var(--mm-c,#8a3ffc),transparent);
  transition:background .8s;
}

/* tarjetas */
.mm-carousel .mm-card{
  position:absolute; left:50%; top:44%;
  width:var(--cw); margin-left:calc(var(--cw) / -2); margin-top:calc(var(--cw) * -.5);
  display:block; text-decoration:none; color:#fff; outline:none;
  will-change:transform,opacity; -webkit-tap-highlight-color:transparent;
}
.mm-carousel .mm-card__frame{
  position:relative; display:block; aspect-ratio:1/1; border-radius:6px; overflow:hidden;
  background:#111; box-shadow:0 30px 60px -20px rgba(0,0,0,.9);
  transition:box-shadow .4s, transform .4s cubic-bezier(.2,.8,.2,1);
}
.mm-carousel .mm-card__frame img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
  transform:scale(1.02); transition:transform .8s cubic-bezier(.2,.8,.2,1);
  -webkit-user-drag:none;
}
.mm-carousel .mm-card__frame::before{ /* borde con colores de marca */
  content:""; position:absolute; inset:0; z-index:2; border-radius:inherit; padding:2px;
  background:var(--mm-brand); opacity:0; transition:opacity .4s;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
}
.mm-carousel .mm-card__frame::after{ /* brillo de vidrio + viñeta */
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 30%),
             linear-gradient(0deg,rgba(0,0,0,.4),transparent 40%);
}
.mm-carousel .mm-card__cta{
  position:absolute; z-index:3; left:50%; bottom:16px;
  transform:translate(-50%,10px); opacity:0; white-space:nowrap;
  font-weight:700; font-size:15px; letter-spacing:.02em;
  padding:9px 20px; border-radius:999px; background:var(--mm-pink);
  box-shadow:0 8px 24px rgba(255,10,108,.5); transition:.35s cubic-bezier(.2,.8,.2,1);
}
.mm-carousel .mm-card__title{
  display:block; text-align:center; margin-top:16px;
  font-weight:600; font-size:clamp(16px,1.6vw,22px); line-height:1.2;
  opacity:var(--t,1); transition:opacity .3s;
}
.mm-carousel .mm-card.is-front .mm-card__frame{
  box-shadow:0 40px 80px -20px rgba(0,0,0,.95),0 0 50px -18px var(--mm-c);
}
.mm-carousel .mm-card.is-front .mm-card__frame::before{opacity:.9}
.mm-carousel .mm-card.is-front .mm-card__title{font-weight:700}
.mm-carousel .mm-card:hover .mm-card__frame,
.mm-carousel .mm-card:focus-visible .mm-card__frame{
  transform:translateY(-8px);
  box-shadow:0 50px 90px -20px rgba(0,0,0,.95),0 0 70px -6px var(--mm-c);
}
.mm-carousel .mm-card:hover .mm-card__frame::before,
.mm-carousel .mm-card:focus-visible .mm-card__frame::before{opacity:1}
.mm-carousel .mm-card:hover img,.mm-carousel .mm-card:focus-visible img{transform:scale(1.08)}
.mm-carousel .mm-card:hover .mm-card__cta,
.mm-carousel .mm-card:focus-visible .mm-card__cta{opacity:1; transform:translate(-50%,0)}

/* piso */
.mm-carousel .mm-floor{
  position:absolute; left:0; right:0; bottom:0; height:30%; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse 50% 60% at 50% 0%,rgba(255,255,255,.07),transparent 70%);
}
.mm-carousel .mm-floor::before{
  content:""; position:absolute; left:15%; right:15%; top:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
}

/* destellos de luz */
.mm-carousel .mm-streaks{position:absolute; inset:0; z-index:1; pointer-events:none}
.mm-carousel .mm-streaks i{
  position:absolute; left:-40%; width:45%; height:1px; opacity:0;
  background:linear-gradient(90deg,transparent,var(--c),#fff,transparent);
  filter:drop-shadow(0 0 4px var(--c)); animation:mmStreak 9s linear infinite;
}
.mm-carousel .mm-streaks i:nth-child(1){top:38%; --c:#7cc4ff}
.mm-carousel .mm-streaks i:nth-child(2){top:46%; --c:#8a3ffc; animation-delay:3s; animation-duration:11s}
.mm-carousel .mm-streaks i:nth-child(3){top:54%; --c:#ff0a6c; animation-delay:6s; animation-duration:10s}
@keyframes mmStreak{
  0%{transform:translateX(0) rotate(-3deg); opacity:0}
  15%{opacity:.8} 70%{opacity:.4}
  100%{transform:translateX(330%) rotate(1deg); opacity:0}
}

/* flechas */
.mm-carousel .mm-arrow{
  position:absolute; top:44%; z-index:3000; transform:translateY(-50%);
  width:52px; height:52px; border-radius:50%; cursor:pointer; padding:0;
  display:grid; place-items:center; color:#fff;
  border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); transition:.25s;
}
.mm-carousel .mm-arrow svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.mm-carousel .mm-arrow:hover,.mm-carousel .mm-arrow:focus-visible{background:var(--mm-pink); border-color:var(--mm-pink); outline:none; box-shadow:0 0 24px rgba(255,10,108,.55)}
.mm-carousel .mm-arrow--prev{left:2%}
.mm-carousel .mm-arrow--next{right:2%}

/* pestañas con barra de progreso */
.mm-carousel .mm-tabs{
  position:relative; z-index:5; display:flex; justify-content:center; flex-wrap:wrap;
  gap:6px 28px; max-width:1100px; margin:0 auto; padding:0 16px;
}
.mm-carousel .mm-tab{
  position:relative; background:none; border:0; cursor:pointer; color:rgba(255,255,255,.45);
  font:600 15px/1 'Titillium Web',system-ui,sans-serif; letter-spacing:.04em; text-transform:uppercase;
  padding:12px 0 14px; transition:color .3s;
}
.mm-carousel .mm-tab::before,.mm-carousel .mm-tab::after{
  content:""; position:absolute; left:0; bottom:0; height:2px; border-radius:2px;
}
.mm-carousel .mm-tab::before{right:0; background:rgba(255,255,255,.12)}
.mm-carousel .mm-tab::after{width:calc(var(--p,0) * 100%); background:var(--mm-brand); background-size:var(--bw,100px) 100%}
.mm-carousel .mm-tab:hover,.mm-carousel .mm-tab:focus-visible{color:#fff; outline:none}
.mm-carousel .mm-tab.is-active{color:#fff}
.mm-carousel .mm-live{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

@media (max-width:767px){
  .mm-carousel .mm-arrow{width:40px; height:40px}
  .mm-carousel .mm-arrow svg{width:18px; height:18px}
  .mm-carousel .mm-tabs{gap:8px}
  .mm-carousel .mm-tab{font-size:0; width:28px; padding:10px 0}
  .mm-carousel .mm-tab::before,.mm-carousel .mm-tab::after{height:3px}
  .mm-carousel .mm-card__cta{font-size:13px; padding:7px 14px; bottom:10px}
}
@media (hover:none){
  .mm-carousel .mm-card.is-front .mm-card__cta{opacity:1; transform:translate(-50%,0)}
}
@media (prefers-reduced-motion:reduce){
  .mm-carousel .mm-streaks{display:none}
}
</style>

<script>
(function () {
  /* ======================================================
     CONFIGURA AQUÍ TUS MEDIOS
     - titulo: texto bajo la imagen
     - imagen: URL de la imagen
     - url:    página a la que lleva el clic
     - color:  color del brillo cuando está al frente
     ====================================================== */
  var U = 'https://forestgreen-chicken-561284.hostingersite.com/wp-content/uploads/2026/10/';
  var MEDIOS = [
    { titulo: 'Pantallas Digitales',     imagen: U + 'mediamaster-pantalla-digital-edificio.webp',  url: '/pantallas-digitales/',     color: '#8a3ffc' },
    { titulo: 'Espectaculares',          imagen: U + 'mediamaster-espectaculares.webp',             url: '/espectaculares/',          color: '#ff7a00' },
    { titulo: 'Tótems',                  imagen: U + 'mediamaster-totem-restaurante.webp',          url: '/totems/',                  color: '#22d65a' },
    { titulo: 'AIQ',                     imagen: U + 'mediamaster-aeropuerto-pantalla-digital.webp', url: '/aiq/',                    color: '#ff0a6c' },
    { titulo: 'AICM',                    imagen: U + 'mediamaster-aeropuerto-cdmx-aicm.webp',       url: '/aicm/',                    color: '#3aa0ff' },
    { titulo: 'Terminales de autobuses', imagen: U + 'mediamaster-terminales.webp',                 url: '/terminales-de-autobuses/', color: '#f5e400' }
  ];

  var SEGUNDOS_POR_SLIDE = 3.5;   // tiempo que cada medio se queda al frente
  var ABRIR_EN_NUEVA_PESTANA = false;

  /* ---------------- no es necesario editar abajo ---------------- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var target = ABRIR_EN_NUEVA_PESTANA ? '_blank' : '_self';

  document.querySelectorAll('.mm-carousel:not([data-ready])').forEach(function (root) {
    root.setAttribute('data-ready', '1');
    var stage = root.querySelector('.mm-stage');
    var ring = root.querySelector('.mm-ring');
    var tabsEl = root.querySelector('.mm-tabs');
    var live = root.querySelector('.mm-live');
    var n = MEDIOS.length, step = 360 / n;

    var cards = MEDIOS.map(function (m, i) {
      var a = document.createElement('a');
      a.className = 'mm-card';
      a.href = m.url;
      a.target = target;
      if (target === '_blank') a.rel = 'noopener';
      a.style.setProperty('--mm-c', m.color);
      a.setAttribute('aria-label', m.titulo + ' (' + (i + 1) + ' de ' + n + ')');
      a.innerHTML =
        '<span class="mm-card__frame"><img alt="" loading="' + (i < 3 ? 'eager' : 'lazy') + '" decoding="async" draggable="false">' +
        '<span class="mm-card__cta">Ver más →</span></span><span class="mm-card__title"></span>';
      var img = a.querySelector('img');
      img.src = m.imagen;
      img.alt = m.titulo + ' – Mediamaster';
      a.querySelector('.mm-card__title').textContent = m.titulo;
      ring.appendChild(a);
      return a;
    });

    var tabs = MEDIOS.map(function (m, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'mm-tab';
      b.textContent = m.titulo;
      b.setAttribute('aria-label', 'Ver ' + m.titulo);
      b.addEventListener('click', function () { goTo(i); });
      tabsEl.appendChild(b);
      return b;
    });

    var angle = 0, targetAngle = 0, index = 0, timer = 0;
    var hovering = false, focused = false, mobile = false, W = 0, CW = 0, RX = 0, RZ = 0, last = performance.now();

    function layout() {
      W = stage.clientWidth;
      mobile = W < 768;
      CW = mobile ? Math.min(280, W * 0.62) : Math.max(220, Math.min(400, W * 0.29));
      RX = mobile ? W * 0.42 : Math.min(W * 0.36, 560);
      RZ = CW * 0.9;
      stage.style.setProperty('--cw', CW + 'px');
      stage.style.setProperty('--sh', Math.round(CW * 1.55) + 'px');
      tabs.forEach(function (t) { t.style.setProperty('--bw', t.offsetWidth + 'px'); });
    }

    function mod(i) { return ((i % n) + n) % n; }

    function goTo(i, dir) {
      var cur = mod(index);
      var d = mod(i) - cur;
      if (dir === undefined) { if (d > n / 2) d -= n; if (d < -n / 2) d += n; }
      else d = dir;
      index += d;
      targetAngle = -index * step;
      timer = 0;
      var m = MEDIOS[mod(index)];
      root.style.setProperty('--mm-c', m.color);
      live.textContent = m.titulo;
    }

    function render() {
      var front = mod(index);
      for (var i = 0; i < n; i++) {
        var a = (angle + i * step) * Math.PI / 180;
        var s = Math.sin(a), c = Math.cos(a);
        var x = s * RX, z = (c - 1) * RZ;              // el frente queda en z=0 → imagen nítida
        var depth = (c + 1) / 2;                       // 0 atrás · 1 frente
        var el = cards[i];
        el.style.transform =
          'translate3d(' + x.toFixed(1) + 'px,' + ((1 - depth) * -CW * 0.12).toFixed(1) + 'px,' + z.toFixed(1) + 'px) ' +
          'rotateY(' + (s * -32).toFixed(1) + 'deg)';
        el.style.zIndex = Math.round(1000 + c * 500);
        el.style.opacity = Math.max(0, depth * 1.25 - 0.1).toFixed(3);
        el.style.filter = depth > 0.97 ? 'none' : 'brightness(' + (0.3 + depth * 0.7).toFixed(2) + ')';
        el.style.setProperty('--t', Math.max(0, Math.min(1, mobile ? (depth - 0.85) * 8 : (depth - 0.6) * 5)).toFixed(2));
        el.style.pointerEvents = depth < 0.3 ? 'none' : 'auto';
        el.tabIndex = depth < 0.3 ? -1 : 0;
        el.classList.toggle('is-front', i === front);
      }
      var p = Math.min(1, timer / SEGUNDOS_POR_SLIDE);
      tabs.forEach(function (t, i) {
        t.classList.toggle('is-active', i === front);
        t.style.setProperty('--p', i === front ? (reduce ? 1 : p) : 0);
      });
    }

    function loop(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      var paused = hovering || focused || document.hidden || reduce;
      if (!paused) {
        timer += dt;
        if (timer >= SEGUNDOS_POR_SLIDE) goTo(index + 1, 1);
      }
      angle += (targetAngle - angle) * (1 - Math.pow(0.0015, dt));   // giro suave
      if (Math.abs(targetAngle - angle) < 0.01) angle = targetAngle;
      render();
      requestAnimationFrame(loop);
    }

    // se detiene al pasar el cursor por una tarjeta, flecha o pestaña
    ring.addEventListener('mouseover', function (e) { hovering = !!e.target.closest('.mm-card'); });
    ring.addEventListener('mouseleave', function () { hovering = false; });
    root.querySelectorAll('.mm-arrow, .mm-tabs').forEach(function (el) {
      el.addEventListener('mouseenter', function () { hovering = true; });
      el.addEventListener('mouseleave', function () { hovering = false; });
    });
    root.addEventListener('focusin', function (e) {
      focused = true;
      var i = cards.indexOf(e.target);
      if (i > -1 && e.target.matches(':focus-visible')) goTo(i);
    });
    root.addEventListener('focusout', function () { focused = false; });

    root.querySelector('.mm-arrow--prev').addEventListener('click', function () { goTo(index - 1, -1); });
    root.querySelector('.mm-arrow--next').addEventListener('click', function () { goTo(index + 1, 1); });
    root.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { goTo(index - 1, -1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { goTo(index + 1, 1); e.preventDefault(); }
    });

    // deslizar en móvil
    var sx = null, sy = 0, dx = 0, swiped = false;
    stage.addEventListener('touchstart', function (e) {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; swiped = false; hovering = true;
    }, { passive: true });
    stage.addEventListener('touchmove', function (e) {
      if (sx === null) return;
      dx = e.touches[0].clientX - sx;
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(e.touches[0].clientY - sy)) {
        swiped = true;
        angle = targetAngle + dx / RX * 40;
      }
    }, { passive: true });
    stage.addEventListener('touchend', function () {
      if (swiped && Math.abs(dx) > 40) goTo(dx < 0 ? index + 1 : index - 1, dx < 0 ? 1 : -1);
      sx = null;
      hovering = false;
      timer = -2;                                     // espera un poco más tras tocar
    });
    // en móvil, tocar una tarjeta lateral la trae al frente; tocar la del frente abre su página
    stage.addEventListener('click', function (e) {
      if (swiped) { e.preventDefault(); swiped = false; return; }
      var card = e.target.closest('.mm-card');
      if (!card || !window.matchMedia('(hover: none)').matches) return;
      var i = cards.indexOf(card);
      if (i !== mod(index)) { e.preventDefault(); goTo(i); }
    }, true);

    window.addEventListener('resize', layout);
    layout();
    goTo(0);
    angle = targetAngle;
    requestAnimationFrame(loop);
  });
})();
</script>
